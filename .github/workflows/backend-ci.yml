name: Backend CI
on:
  push:
    branches: [main, 'backend/**']
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: kasyno_test
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U test -d kasyno_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://test:test@localhost:5433/kasyno_test
      TEST_DATABASE_URL: postgresql+psycopg://test:test@localhost:5433/kasyno_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.6'
          python-version: '3.14'
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run alembic upgrade head && uv run alembic check && uv run alembic downgrade base && uv run alembic upgrade head
      - run: uv run pytest
      - run: docker build -t kasyno-backend:ci .
      - run: cp .env.example .env && docker compose config --quiet && docker compose up --build -d --wait && curl --fail http://localhost:8000/health/ready
        working-directory: .
      - if: always()
        run: docker compose down -v
        working-directory: .
