name: Pull request quality
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check changed lines for whitespace errors
        run: git diff --check HEAD^1 HEAD
      - name: Validate GitHub issue forms
        run: |
          ruby -ryaml -e '
            forms = Dir[".github/ISSUE_TEMPLATE/*.{yml,yaml}"].reject { |f| File.basename(f).start_with?("config.") }
            abort "No issue forms found" if forms.empty?
            forms.each do |path|
              form = YAML.safe_load_file(path)
              abort "Invalid form: #{path}" unless form.is_a?(Hash) &&
                %w[name description].all? { |key| form[key].is_a?(String) && !form[key].strip.empty? } &&
                form["body"].is_a?(Array) && !form["body"].empty?
            end'
      - name: Detect backend in the proposed merge
        id: scope
        run: |
          if [[ -d backend ]] || git cat-file -e HEAD^1:backend 2>/dev/null; then
            echo 'backend=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: astral-sh/setup-uv@v6
        if: steps.scope.outputs.backend == 'true'
        with:
          version: '0.13.6'
          python-version: '3.14'
      - name: Check backend and run tests against PostgreSQL
        if: steps.scope.outputs.backend == 'true'
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://test:test@localhost:5433/kasyno_test
          TEST_DATABASE_URL: postgresql+psycopg://test:test@localhost:5433/kasyno_test
        run: |
          docker run -d --name pr-postgres -p 127.0.0.1:5433:5432 \
            -e POSTGRES_USER=test -e POSTGRES_PASSWORD=test -e POSTGRES_DB=kasyno_test postgres:17-bookworm
          timeout 60 bash -c 'until docker exec pr-postgres pg_isready -h localhost -U test -d kasyno_test; do sleep 1; done'
          uv sync --locked
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
          uv run --no-sync mypy app
          uv run --no-sync alembic upgrade head
          uv run --no-sync alembic check
          uv run --no-sync pytest
